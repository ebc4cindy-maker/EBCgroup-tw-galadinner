<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trader's Gambit｜主持人大螢幕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,700;1,6..96,900&family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="host">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<radialGradient id="rbShell" cx="38%" cy="30%" r="80%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F3ECE4"/><stop offset="1" stop-color="#CDBFB3"/></radialGradient>
<radialGradient id="rbMetal" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#C2566F"/><stop offset=".5" stop-color="#7A1F35"/><stop offset="1" stop-color="#3E0B18"/></radialGradient>
<filter id="rbGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="rbSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
</defs></svg>
<main class="screen" id="screen" aria-live="polite"></main>
<div class="host-actions">
  <button class="btn" id="hostBtn" type="button" disabled>連線中…</button>
  <button class="btn sec" id="viewBtn" type="button" hidden>看更長期的走勢</button>
  <button class="btn sec" id="botBtn" type="button" hidden>測試：加入 10 位模擬玩家</button>
  <span class="progress" id="hostProg"></span>
  <button class="ghost" id="resetBtn" type="button" style="margin-left:auto">清除重來</button>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="core.js"></script>
<script src="host.js"></script>
</body>
</html>
